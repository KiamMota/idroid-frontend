<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <title>Trocas (Trade-in) · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="btn-back" aria-label="Voltar">←</button>
    <h1>Troca de Aparelhos</h1>
  </header>

  <main class="app-main">
    <div class="tabs" id="troca-tabs">
      <button class="tab active" data-tab="nova">Nova Troca</button>
      <button class="tab" data-tab="lista">Histórico</button>
    </div>

    <!-- TAB: Nova Troca -->
    <section id="tab-nova">
      <form id="form-troca" class="animate-in">
        <div class="form-group">
          <label for="troca-modelo">Modelo do aparelho *</label>
          <input type="text" id="troca-modelo" required placeholder="Ex: iPhone 12 128GB">
        </div>

        <div class="form-group">
          <label for="troca-imei">IMEI <span class="text-muted">(opcional)</span></label>
          <input type="text" id="troca-imei" placeholder="14 ou 15 dígitos" maxlength="15" inputmode="numeric">
        </div>

        <div class="form-group">
          <label for="troca-avaliacao">Valor de avaliação (R$) *</label>
          <input type="number" id="troca-avaliacao" required step="0.01" min="0" placeholder="0,00" inputmode="decimal">
        </div>

        <div class="form-group">
          <label for="troca-condicao">Condição</label>
          <select id="troca-condicao">
            <option value="">— Selecione —</option>
            <option value="OTIMO">Ótimo</option>
            <option value="BOM">Bom</option>
            <option value="REGULAR">Regular</option>
            <option value="RUIM">Ruim</option>
            <option value="USADO">Usado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="troca-observacoes">Observações</label>
          <textarea id="troca-observacoes" rows="2" placeholder="Detalhes adicionais (opcional)"></textarea>
        </div>

        <p class="text-muted mt-1" style="font-size:0.8rem">
          Ao confirmar, o aparelho entra como troca no sistema.
        </p>
        <button type="submit" class="btn btn-primary btn-block mt-2">Registrar Troca</button>
      </form>
    </section>

    <!-- TAB: Histórico -->
    <section id="tab-lista" class="hidden">
      <div id="troca-list">
        <div class="empty-state">
          <div class="icon">🔄</div>
          <p>Nenhuma troca registrada ainda.</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="../../js/pages/trocas.js"></script>
</body>
</html>
