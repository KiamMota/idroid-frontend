<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <title>Estoque · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="btn-back" aria-label="Voltar">←</button>
    <h1>Estoque &amp; Aparelhos</h1>
  </header>

  <main class="app-main">
    <div class="tabs" id="est-tabs">
      <button class="tab active" data-tab="produtos">Produtos</button>
      <button class="tab" data-tab="entrada" id="tab-btn-entrada">Entrada</button>
    </div>

    <!-- TAB PRODUTOS -->
    <section id="tab-produtos">
      <!-- Grid de categorias -->
      <div class="grid-cards animate-in" id="cat-grid">
        <button class="grid-card" data-categoria="CELULAR">
          <span class="icon">📱</span>
          <span class="label">Celulares</span>
          <span class="sub" id="count-CELULAR">0 itens</span>
        </button>
        <button class="grid-card" data-categoria="ACESSORIO">
          <span class="icon">🎧</span>
          <span class="label">Acessórios</span>
          <span class="sub" id="count-ACESSORIO">0 itens</span>
        </button>
        <button class="grid-card" data-categoria="PECA">
          <span class="icon">🔧</span>
          <span class="label">Peças</span>
          <span class="sub" id="count-PECA">0 itens</span>
        </button>
        <button class="grid-card" data-categoria="OUTRO">
          <span class="icon">📦</span>
          <span class="label">Outros</span>
          <span class="sub" id="count-OUTRO">0 itens</span>
        </button>
      </div>

      <!-- Lista de produtos -->
      <div id="est-list-header" class="list-header mt-2" style="display:none;">
        <span id="cat-title" class="list-header-title">Produtos</span>
        <button class="btn btn-outline btn-sm" id="btn-voltar-cats">← Categorias</button>
      </div>
      <div id="est-list">
        <div class="empty-state"><div class="icon">📦</div><p>Selecione uma categoria acima.</p></div>
      </div>
    </section>

    <!-- TAB ENTRADA / EDIÇÃO -->
    <section id="tab-entrada" class="hidden">
      <form id="form-entrada">
        <h3 id="form-titulo" style="margin-top: 0;">Nova Entrada</h3>
        
        <!-- Campo Oculto para o ID na Edição -->
        <input type="hidden" id="ent-id">

        <div class="form-group">
          <label for="ent-nome">Nome / Modelo *</label>
          <input type="text" id="ent-nome" required>
        </div>
        <div class="form-group">
          <label for="ent-categoria">Categoria *</label>
          <select id="ent-categoria" required>
            <option value="CELULAR">Celular</option>
            <option value="ACESSORIO">Acessório</option>
            <option value="PECA">Peça</option>
            <option value="OUTRO">Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ent-preco">Preço (R$)</label>
          <input type="number" id="ent-preco" step="0.01" min="0" inputmode="decimal">
        </div>
        <div class="form-group">
          <label for="ent-qtd">Quantidade / Estoque *</label>
          <input type="number" id="ent-qtd" value="1" min="0" required inputmode="numeric">
        </div>

        <button type="submit" id="btn-salvar-ent" class="btn btn-primary btn-block">Registrar Entrada</button>
        
        <!-- Botões de ação para modo de Edição -->
        <div id="edit-actions" style="display: none; flex-direction: column; gap: 8px; margin-top: 1rem;">
          <button type="button" id="btn-cancelar-edicao" class="btn btn-outline btn-block">Cancelar Edição</button>
          <button type="button" id="btn-excluir-produto" class="btn btn-outline btn-block" style="color: #dc3545; border-color: #dc3545;">Excluir Produto</button>
        </div>
      </form>
    </section>

  </main>

  <script type="module" src="../../js/pages/estoque.js"></script>
</body>
</html>
