<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <title>Auditoria · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="btn-back" aria-label="Voltar">←</button>
    <h1>Registro de Auditoria</h1>
  </header>

  <main class="app-main">
    <!-- Filtro de Período -->
    <div class="flex gap-1 mb-2">
      <button class="btn btn-primary btn-sm" id="btn-dia" style="flex:1">Dia</button>
      <button class="btn btn-outline btn-sm" id="btn-mes" style="flex:1">Mês</button>
    </div>

    <!-- Lista de Logs -->
    <div class="card">
      <div class="card-title">Histórico de Alterações</div>
      <div id="auditoria-list">
        <p class="text-muted" style="font-size:0.85rem">Carregando registros...</p>
      </div>
    </div>
  </main>

  <!-- Modal de Detalhes da Auditoria -->
  <div id="modal-auditoria" class="modal hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div class="card" style="width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto;">
      <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>Detalhes da Ação</span>
        <button id="btn-close-modal" style="background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: inherit;">✕</button>
      </div>

      <div id="modal-content" style="font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px;">
        <!-- Preenchido dinamicamente pelo JS -->
      </div>
    </div>
  </div>

  <script type="module" src="../../js/pages/auditoria.js"></script>
</body>
</html>
