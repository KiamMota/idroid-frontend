<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <title>Ordens de Serviço · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
  <style>
    /* Botão flutuante + */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary, #f06522);
      color: #fff;
      border: none;
      font-size: 28px;
      line-height: 1;
      box-shadow: 0 4px 14px rgba(240, 101, 34, 0.45);
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .fab:active { transform: scale(0.94); }
    .fab:disabled { opacity: 0.5; pointer-events: none; }

    /* Tabs de filtro */
    .os-filter-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 12px;
      border-bottom: 2px solid #eee;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .os-filter-tabs .tab {
      flex: 1;
      padding: 12px 8px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 500;
      color: #888;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .os-filter-tabs .tab.active {
      color: var(--primary, #f06522);
      font-weight: 600;
    }
    .os-filter-tabs .tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary, #f06522);
    }

    /* Overlay do formulário (nova / edição) */
    .os-form-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 100;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .os-form-overlay.open {
      transform: translateY(0);
    }
    .os-form-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
      background: #fff;
    }
    .os-form-header h2 {
      font-size: 1.1rem;
      margin: 0;
      flex: 1;
    }
    .os-form-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .os-form-footer {
      padding: 12px 16px;
      border-top: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      background: #fff;
    }
    .list-item {
      cursor: pointer;
      transition: background 0.15s;
    }
    .list-item:active {
      background: #f5f5f5;
    }

    /* Action sheet (menu Editar / Finalizar / Excluir) */
    .action-sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .action-sheet-backdrop.open {
      opacity: 1;
      visibility: visible;
    }
    .action-sheet {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 20px;
      background: #fff;
      border-radius: 16px;
      z-index: 210;
      transform: translateY(120%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .action-sheet.open {
      transform: translateY(0);
    }
    .action-sheet-header {
      padding: 14px 16px 8px;
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      border-bottom: 1px solid #f0f0f0;
    }
    .action-sheet-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border: none;
      background: #fff;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }
    .action-sheet-item:last-of-type {
      border-bottom: none;
    }
    .action-sheet-item:active {
      background: #f5f5f5;
    }
    .action-sheet-item.editar { color: #1a1a1a; }
    .action-sheet-item.finalizar { color: #16a34a; }
    .action-sheet-item.excluir { color: #dc2626; }
    .action-sheet-cancel {
      margin-top: 8px;
      border-radius: 14px;
      background: #f5f5f5;
      font-weight: 600;
      color: #333;
      border: none;
      width: calc(100% - 24px);
      margin-left: 12px;
      margin-right: 12px;
      margin-bottom: 12px;
      padding: 14px;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .action-sheet-cancel:active {
      background: #e8e8e8;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="btn-back" aria-label="Voltar">←</button>
    <h1>Ordens de Serviço</h1>
  </header>

  <main class="app-main">
    <!-- Abas de filtro -->
    <div class="os-filter-tabs" id="os-filter-tabs">
      <button class="tab active" data-filter="andamento">Em andamento</button>
      <button class="tab" data-filter="finalizadas">Finalizadas</button>
    </div>

    <!-- Lista -->
    <section id="tab-lista">
      <div id="os-list">
        <div class="empty-state">
          <div class="icon">🛠️</div>
          <p>Nenhuma ordem de serviço ainda.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Botão flutuante para nova OS -->
  <button class="fab" id="btn-nova-os" aria-label="Nova ordem de serviço">+</button>

  <!-- Action sheet (menu ao clicar na OS) -->
  <div class="action-sheet-backdrop" id="action-sheet-backdrop"></div>
  <div class="action-sheet" id="action-sheet">
    <div class="action-sheet-header" id="action-sheet-title">OS #—</div>
    <button class="action-sheet-item" id="as-inspect">📄  Ver detalhes</button>
    <button class="action-sheet-item editar" id="as-editar">✏️  Editar</button>
    <button class="action-sheet-item finalizar" id="as-finalizar">✓  Finalizar</button>
    <button class="action-sheet-item excluir" id="as-excluir">🗑️  Excluir</button>
    <button class="action-sheet-cancel" id="as-cancelar">Cancelar</button>
  </div>

  <!-- Overlay: formulário Nova / Editar OS -->
  <div class="os-form-overlay" id="os-form-overlay">
    <div class="os-form-header">
      <button class="back-btn" id="btn-fechar-form" aria-label="Fechar">←</button>
      <h2 id="form-titulo">Nova Ordem de Serviço</h2>
    </div>

    <div class="os-form-body">
      <form id="form-os">
        <input type="hidden" id="os-id">

        <!-- Campo único de identificação do cliente -->
        <div class="form-group">
          <label for="os-telefone">Telefone do Cliente *</label>
          <input type="tel" id="os-telefone" placeholder="(00) 00000-0000" required inputmode="tel" maxlength="15">
        </div>

        <div class="form-group">
          <label for="os-nome-servico">Nome do serviço *</label>
          <input type="text" id="os-nome-servico" placeholder="Ex: MANUTENÇÃO DE SMARTPHONE" required style="text-transform: uppercase;">
        </div>

        <div class="form-group">
          <label for="os-defeito">Defeito relatado *</label>
          <textarea id="os-defeito" rows="2" placeholder="Ex: Não liga, tela quebrada…" required></textarea>
        </div>

        <div class="form-group">
          <label for="os-servico">Serviço a realizar *</label>
          <textarea id="os-servico" rows="2" placeholder="Ex: Troca de display, limpeza…" required></textarea>
        </div>

        <!-- Campo de valor com tipo text e inputmode numérico para aplicar a máscara -->
        <div class="form-group">
          <label for="os-valor">Valor (R$)</label>
          <input type="text" id="os-valor" placeholder="R$ 0,00" inputmode="numeric">
        </div>

        <div class="form-group">
          <label for="os-custo">Custo (R$)</label>
          <input type="text" id="os-custo" placeholder="R$ 0,00" inputmode="numeric">
        </div>

        <div class="form-group" id="grupo-status" style="display:none">
          <label for="os-status">Status</label>
          <select id="os-status">
            <option value="ABERTA">ABERTA</option>
            <option value="EM_ANDAMENTO">EM ANDAMENTO</option>
            <option value="AGUARDANDO_PECA">AGUARDANDO PEÇA</option>
            <option value="CONCLUIDA">CONCLUÍDA</option>
            <option value="ENTREGUE">ENTREGUE</option>
            <option value="CANCELADA">CANCELADA</option>
          </select>
        </div>

        <div class="form-group">
          <label>Assinatura do cliente (retirada)</label>
          <div class="signature-area">
            <canvas id="sig-canvas" width="400" height="160"></canvas>
          </div>
          <div class="signature-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="sig-clear">Limpar</button>
            <button type="button" class="btn btn-outline btn-sm" id="sig-confirm">Confirmar assinatura</button>
          </div>
          <input type="hidden" id="os-assinatura">
          <p class="text-muted" style="font-size:0.75rem;margin-top:4px" id="sig-status">Aguardando assinatura…</p>
        </div>

        <div id="os-alerta" class="hidden" style="background:#fef3c7;border-radius:10px;padding:12px;margin-bottom:12px;font-size:0.9rem;color:#92400e">
          ⚠️ Já existe atendimento para este telefone. Verifique para evitar duplicidade.
        </div>
      </form>
    </div>

    <div class="os-form-footer">
      <button type="submit" form="form-os" class="btn btn-primary btn-block" id="btn-salvar">Salvar Ordem de Serviço</button>
    </div>
  </div>

  <script type="module" src="../../js/pages/ordens.js"></script>

 
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const inputTelefone = document.getElementById('os-telefone');
      const inputValor = document.getElementById('os-valor');

      // Máscara de Telefone: (00) 00000-0000
      if (inputTelefone) {
        inputTelefone.addEventListener('input', (e) => {
          let value = e.target.value.replace(/\D/g, '');
          if (value.length > 11) value = value.slice(0, 11);

          if (value.length > 6) {
            value = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7)}`;
          } else if (value.length > 2) {
            value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
          } else if (value.length > 0) {
            value = `(${value}`;
          }
          e.target.value = value;
        });
      }

      // Máscara de Preço em Real (R$)
      if (inputValor) {
        inputValor.addEventListener('input', (e) => {
          let value = e.target.value.replace(/\D/g, '');
          if (!value) {
            e.target.value = '';
            return;
          }
          const options = { minimumFractionDigits: 2, maximumFractionDigits: 2 };
          const result = (parseFloat(value) / 100).toLocaleString('pt-BR', options);
          e.target.value = `R$ ${result}`;
        });
      }

      // Máscara de Custo em Real (R$)
      const inputCusto = document.getElementById('os-custo');
      if (inputCusto) {
        inputCusto.addEventListener('input', (e) => {
          let value = e.target.value.replace(/\D/g, '');
          if (!value) {
            e.target.value = '';
            return;
          }
          const options = { minimumFractionDigits: 2, maximumFractionDigits: 2 };
          const result = (parseFloat(value) / 100).toLocaleString('pt-BR', options);
          e.target.value = `R$ ${result}`;
        });
      }
    });
  </script>
</body>
</html>
