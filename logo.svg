<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Fundo -->
  <rect width="1000" height="1000" fill="#FFFFFF" />

  <!-- Forma Laranja Superior -->
  <!-- Utiliza arcos matematicamente precisos para criar o encaixe (gap) perfeitamente uniforme de 24px -->
  <path d="M 240,150 
           L 700,150 
           A 84,84 0 0 0 624.105,270 
           L 360,270 
           L 360,766 
           A 60,60 0 0 1 240,766 
           Z" 
        fill="#F16522" />

  <!-- Forma Preta Inferior -->
  <!-- O arco côncavo acompanha a forma laranja com exatidão -->
  <path d="M 760,850 
           L 300,850 
           A 84,84 0 0 0 375.895,730 
           L 640,730 
           L 640,234 
           A 60,60 0 0 1 760,234 
           Z" 
        fill="#000000" />

  <!-- Botão Central (Posicionado mantendo as margens interna, direita e inferior geometricamente iguais) -->
  <circle cx="500" cy="590" r="52" fill="#F16522" />
</svg>
