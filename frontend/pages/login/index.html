<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Login · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/login.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="logo-wrap">
      <img src="../../assets/logo.svg" alt="IDroid Virtual" width="100" height="100">
    </div>
    <h1 class="welcome">Bem vindo!</h1>
    <p class="subtitle">IDroid Virtual — Gestão</p>

    <form class="login-form" id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="email">E-mail / Login</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="username" inputmode="email">
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-login">
        Entrar
      </button>
    </form>

    <p class="brand-footer">
      <strong>IDroid Virtual</strong> · Gestão inteligente
    </p>
  </div>

  <script type="module" src="../../js/pages/login.js"></script>
</body>
</html>
